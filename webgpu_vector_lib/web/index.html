<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Vector Graphics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: black;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background-color: black;
  }

  #tuner {
    position: fixed;
    top: 1rem;
    right: 1rem;
    display: none;
    width: min(22rem, calc(100vw - 2rem));
    padding: 0.85rem;
    color: rgb(225, 242, 255);
    background: rgba(4, 8, 12, 0.78);
    border: 1px solid rgba(120, 210, 255, 0.28);
    border-radius: 6px;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(8px);
  }

  #tuner[data-visible="true"] {
    display: grid;
    gap: 0.7rem;
  }

  #preset-picker {
    position: fixed;
    top: 1rem;
    left: 1rem;
    display: none;
    padding: 0.6rem 0.75rem;
    color: rgb(225, 242, 255);
    background: rgba(4, 8, 12, 0.78);
    border: 1px solid rgba(120, 210, 255, 0.28);
    border-radius: 6px;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(8px);
  }

  #preset-picker[data-visible="true"] {
    display: block;
  }

  #preset-picker label {
    display: grid;
    gap: 0.35rem;
  }

  #preset-picker select {
    font: inherit;
    color: inherit;
    background: rgba(4, 8, 12, 0.6);
    border: 1px solid rgba(120, 210, 255, 0.35);
    border-radius: 4px;
    padding: 0.25rem;
  }

  .tuner-row {
    display: grid;
    grid-template-columns: 6.5rem 1fr 3rem;
    align-items: center;
    gap: 0.65rem;
  }

  .tuner-row output {
    text-align: right;
    color: rgb(151, 226, 255);
  }

  input[type="range"] {
    width: 100%;
    accent-color: rgb(72, 210, 255);
  }

  @media (max-width: 640px) {
    #tuner {
      top: auto;
      right: 0.75rem;
      bottom: 0.75rem;
      left: 0.75rem;
      width: auto;
      max-height: 45vh;
      overflow: auto;
    }
  }

  #status {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    color: white;
    background: black;
    font-family: system-ui, sans-serif;
    text-align: center;
  }

  #status[data-visible="true"] {
    display: flex;
  }
</style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <section id="tuner" aria-label="Vector display tuner">
        <label class="tuner-row">
            <span>line width</span>
            <input id="line-width" data-setting="lineWidth" type="range" min="0.25" max="3" step="0.05" value="0.35">
            <output for="line-width">0.35</output>
        </label>
        <label class="tuner-row">
            <span>near width</span>
            <input id="near-width" data-setting="nearWidth" type="range" min="1" max="6" step="0.1" value="2.2">
            <output for="near-width">2.2</output>
        </label>
        <label class="tuner-row">
            <span>near light</span>
            <input id="near-light" data-setting="nearLight" type="range" min="0" max="0.6" step="0.01" value="0.33">
            <output for="near-light">0.33</output>
        </label>
        <label class="tuner-row">
            <span>mid width</span>
            <input id="mid-width" data-setting="midWidth" type="range" min="1" max="10" step="0.1" value="5.0">
            <output for="mid-width">5.0</output>
        </label>
        <label class="tuner-row">
            <span>mid light</span>
            <input id="mid-light" data-setting="midLight" type="range" min="0" max="0.35" step="0.005" value="0.12">
            <output for="mid-light">0.12</output>
        </label>
        <label class="tuner-row">
            <span>far width</span>
            <input id="far-width" data-setting="farWidth" type="range" min="1" max="16" step="0.1" value="12.3">
            <output for="far-width">12.3</output>
        </label>
        <label class="tuner-row">
            <span>far light</span>
            <input id="far-light" data-setting="farLight" type="range" min="0" max="0.2" step="0.005" value="0.03">
            <output for="far-light">0.03</output>
        </label>
    </section>
    <section id="preset-picker" aria-label="Display preset">
        <label>
            <span>display preset</span>
            <select id="preset-select">
                <option value="arcade-balanced">Arcade Balanced</option>
                <option value="monochrome-beam">Monochrome Beam</option>
                <option value="color-quadra-scan">Color Quadra Scan</option>
                <option value="clean-neon">Clean Neon</option>
            </select>
        </label>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module">
        import init, { VectorFrame, VectorFrameView, WebGPU, VectorDisplayPreset } from "@pkg/webgpu_vector_lib.js";

        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");
        const tuner = document.getElementById("tuner");
        const params = new URLSearchParams(window.location.search);
        const demo = params.get("demo") || "baseline";
        // Freeze-frame capture mode for the screenshot smoke check (WI-SMOKE-0001):
        // `?frame` (optionally `?frame=<ms>` or `?t=<ms>`) renders exactly one
        // deterministic frame at a fixed elapsed time instead of animating, and
        // signals readiness via window.__smokeReady / window.__smokeError so an
        // external capture script can wait for a stable frame.
        const frameMode = params.has("frame");
        const frameTime = Number(params.get("t") ?? (params.get("frame") || "0")) || 0;
        // Public display presets (DP-0007): map the string key used in the UI and
        // the `?preset=<name>` query param to the wasm-bindgen VectorDisplayPreset enum.
        const presetPicker = document.getElementById("preset-picker");
        const presetSelect = document.getElementById("preset-select");
        const PRESETS = {
            "arcade-balanced": VectorDisplayPreset.ArcadeBalanced,
            "monochrome-beam": VectorDisplayPreset.MonochromeBeam,
            "color-quadra-scan": VectorDisplayPreset.ColorQuadraScan,
            "clean-neon": VectorDisplayPreset.CleanNeon,
        };
        const presetParam = params.get("preset");
        const initialPreset = PRESETS[presetParam] ?? VectorDisplayPreset.ArcadeBalanced;
        const tunerControls = [...document.querySelectorAll("#tuner input[type='range']")];
        const tunerState = Object.fromEntries(
            tunerControls.map((input) => [input.dataset.setting, Number(input.value)])
        );

        function showUnsupported(message) {
            status.textContent = message;
            status.dataset.visible = "true";
        }

        function syncTunerOutputs() {
            for (const input of tunerControls) {
                const value = Number(input.value);
                tunerState[input.dataset.setting] = value;
                input.nextElementSibling.value = value.toString();
            }
        }

        function ringSegment(cx, cy, radius, startTurn, endTurn, segments = 18) {
            const points = [];
            for (let index = 0; index <= segments; index += 1) {
                const t = startTurn + ((endTurn - startTurn) * index) / segments;
                const angle = t * Math.PI * 2;
                points.push(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
            }
            return new Float32Array(points);
        }

        function canvasPixelSize() {
            const scale = window.devicePixelRatio || 1;
            return {
                width: Math.max(1, Math.round(canvas.clientWidth * scale)),
                height: Math.max(1, Math.round(canvas.clientHeight * scale)),
            };
        }

        function buildFrameApiHarness(width, height, time = 0) {
            const frame = new VectorFrame();
            const pulse = 0.9 + 0.1 * Math.sin(time * 0.004);
            const unit = Math.min(width, height);
            const shipX = width * 0.18;
            const shipY = height * 0.5;
            const centerX = width * 0.56;
            const centerY = height * 0.5;
            const asteroidX = width * 0.76;
            const asteroidY = height * 0.42;

            frame.closedPolyline(
                new Float32Array([
                    shipX + unit * 0.11, shipY,
                    shipX - unit * 0.03, shipY - unit * 0.07,
                    shipX + unit * 0.03, shipY,
                    shipX - unit * 0.03, shipY + unit * 0.07,
                ]),
                0.72, 0.92, 1.0, 1.0, unit * 0.012, 1.25 * pulse,
            );
            frame.line(shipX - unit * 0.06, shipY, shipX - unit * 0.16, shipY, 0.35, 0.75, 1.0, 1.0, unit * 0.007, 1.1);
            frame.line(shipX - unit * 0.02, shipY - unit * 0.04, shipX - unit * 0.12, shipY - unit * 0.075, 0.35, 0.75, 1.0, 1.0, unit * 0.006, 0.9);
            frame.line(shipX - unit * 0.02, shipY + unit * 0.04, shipX - unit * 0.12, shipY + unit * 0.075, 0.35, 0.75, 1.0, 1.0, unit * 0.006, 0.9);

            for (const radius of [0.15, 0.23, 0.31].map((value) => value * unit)) {
                frame.polyline(ringSegment(centerX, centerY, radius, 0.06, 0.38), 0.9, 0.95, 1.0, 1.0, unit * 0.008, 0.95);
                frame.polyline(ringSegment(centerX, centerY, radius, 0.48, 0.8), 0.9, 0.95, 1.0, 1.0, unit * 0.008, 0.95);
            }

            frame.closedPolyline(
                new Float32Array([
                    asteroidX - unit * 0.08, asteroidY - unit * 0.09,
                    asteroidX + unit * 0.08, asteroidY - unit * 0.09,
                    asteroidX + unit * 0.14, asteroidY,
                    asteroidX + unit * 0.08, asteroidY + unit * 0.10,
                    asteroidX - unit * 0.08, asteroidY + unit * 0.10,
                    asteroidX - unit * 0.14, asteroidY,
                ]),
                1.0, 0.35, 0.22, 1.0, unit * 0.01, 1.1,
            );
            frame.line(shipX + unit * 0.17, shipY, centerX - unit * 0.25, centerY, 0.45, 0.9, 1.0, 1.0, unit * 0.009, 1.45);
            frame.line(centerX - unit * 0.12, centerY - unit * 0.045, centerX - unit * 0.04, centerY - unit * 0.01, 0.45, 0.9, 1.0, 1.0, unit * 0.006, 0.9);

            for (let index = 0; index < 16; index += 1) {
                const angle = index * 2.399 + 0.2;
                const length = unit * (0.035 + (index % 4) * 0.012);
                const cx = centerX - unit * 0.22;
                const cy = centerY;
                frame.line(
                    cx + Math.cos(angle) * unit * 0.03,
                    cy + Math.sin(angle) * unit * 0.03,
                    cx + Math.cos(angle) * (unit * 0.03 + length),
                    cy + Math.sin(angle) * (unit * 0.03 + length),
                    1.0, 0.74, 0.2, 1.0, unit * 0.005, 0.8 + (index % 3) * 0.2,
                );
            }

            return frame;
        }

        function renderOrReport(gpu, time = performance.now()) {
            try {
                if (demo === "frame-api") {
                    const { width, height } = canvasPixelSize();
                    gpu.renderFrameWithView(
                        buildFrameApiHarness(width, height, time),
                        VectorFrameView.canvasPixels(width, height),
                    );
                } else if (demo === "blasterites") {
                    gpu.render_blasterites_tester(time);
                } else if (demo === "tuner") {
                    gpu.render_blasterites_tuner(
                        time,
                        tunerState.lineWidth,
                        tunerState.nearWidth,
                        tunerState.nearLight,
                        tunerState.midWidth,
                        tunerState.midLight,
                        tunerState.farWidth,
                        tunerState.farLight,
                    );
                } else {
                    gpu.render();
                }
                return true;
            } catch (error) {
                console.error(error);
                showUnsupported(error instanceof Error ? error.message : String(error));
                window.__smokeError = error instanceof Error ? error.message : String(error);
                return false;
            }
        }

        async function run() {
            try {
                await init();
                if (frameMode) {
                    // Wait for layout so the canvas has its real client size before
                    // the renderer samples it; otherwise a pre-layout create() would
                    // size the surface to 1x1 and render nothing.
                    await new Promise((resolve) =>
                        requestAnimationFrame(() => requestAnimationFrame(resolve))
                    );
                }
                const gpu = await WebGPU.createWithPreset("canvas", initialPreset);
                if (demo === "tuner" && !frameMode) {
                    tuner.dataset.visible = "true";
                    syncTunerOutputs();
                    for (const input of tunerControls) {
                        input.addEventListener("input", syncTunerOutputs);
                    }
                }
                // The preset picker applies to demos that render through the shared
                // display settings (baseline, blasterites). The tuner demo overrides
                // display settings every frame, so a preset choice would not stick.
                if (!frameMode && demo !== "tuner") {
                    presetPicker.dataset.visible = "true";
                    if (presetParam && PRESETS[presetParam]) {
                        presetSelect.value = presetParam;
                    }
                    presetSelect.addEventListener("change", () => {
                        gpu.setDisplayPreset(PRESETS[presetSelect.value]);
                        if (demo === "baseline" || demo === "frame-api") {
                            renderOrReport(gpu);
                        }
                    });
                }
                if (frameMode) {
                    // Render a single deterministic frame and signal readiness.
                    if (demo === "tuner") {
                        syncTunerOutputs();
                    }
                    if (renderOrReport(gpu, frameTime)) {
                        window.__smokeReady = true;
                    }
                } else if (demo === "blasterites" || demo === "tuner") {
                    const animate = (time) => {
                        renderOrReport(gpu, time);
                        requestAnimationFrame(animate);
                    };
                    requestAnimationFrame(animate);
                    window.addEventListener("resize", () => renderOrReport(gpu));
                } else {
                    renderOrReport(gpu);
                    window.addEventListener("resize", () => renderOrReport(gpu));
                }
            } catch (error) {
                console.error(error);
                showUnsupported(error instanceof Error ? error.message : String(error));
                window.__smokeError = error instanceof Error ? error.message : String(error);
            }
        }
        
        console.log("Running WebGPU...");
        run();
    </script>

</body>
</html>
